---

replicaCount: 1

image:
  repository: ghcr.io/telekom-mms/t-cloud-cert-sync
  tag: "latest"
  pullPolicy: Always

# -- Erlaubt die Angabe von Secrets für private Container Registries
# Beispiel:
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

config:
  tCloudRegion: "eu-de"
  tCloudDomainName: "MEINE-T-CLOUD-DOMAIN"
  tCloudProjectId: ""
  keepCertRegex: "dummy"
  # -- Only watch TLS Secrets in this namespace and grant Secret access there only (Role instead of
  # ClusterRole). Empty watches every namespace with cluster-wide Secret access.
  watchNamespace: ""

credentials:
  existingSecret:
    name: ""
    accessKeyKey: "OS_ACCESS_KEY"
    secretKeyKey: "OS_SECRET_KEY"
  accessKey: ""
  secretKey: ""

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

name: Build and release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -mod=readonly ./...
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - run: helm lint .helm
      - run: helm template t-cloud-cert-sync .helm > /dev/null
      - run: docker build -t t-cloud-cert-sync:verify .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - run: helm package .helm --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" --destination dist
      - run: cp dist/t-cloud-cert-sync-*.tgz dist/t-cloud-cert-sync.tgz
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chart-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - run: |
          mkdir -p site/charts
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
            while IFS= read -r tag; do
              gh release download "$tag" --pattern 't-cloud-cert-sync-[0-9]*.tgz' --dir site/charts --clobber
            done
          repo=${GITHUB_REPOSITORY#*/}
          helm repo index site/charts --url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${repo}/charts"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
